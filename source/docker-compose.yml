services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab_data_management
      MYSQL_USER: lab_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-only-lab-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/002-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: lab_app
      DB_PASSWORD: ${DB_PASSWORD:-local-only-lab-password}
      DB_NAME: lab_data_management
      ALLOW_DEV_LOGIN: "true"
      NODE_ENV: development
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
